version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .                     # <-- corrige ici
    image: redproduct-backend
    container_name: redproduct-backend
    depends_on:
      - mysql
    expose:
      - "9000"
    volumes:
      - .:/var/www
      - /var/www/vendor           # <-- volume anonyme pour ne pas écraser vendor

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - backend
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www

volumes:
  mysql_data:
